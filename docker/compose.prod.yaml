# The VM (Stage 8): docker compose -f docker/compose.yaml -f docker/compose.prod.yaml up -d --build
# Needs in .env: SITE_ADDRESS (the jouleWise hostname), ERGPLAN_PUBLIC_URL=https://<hostname>,
# POSTGRES_PASSWORD, OPENAI_API_KEY, BILLX_TOKEN, ERGPLAN_SMTP_URL, ERGPLAN_MAIL_FROM.
# Only Caddy is reachable from outside (80/443); everything else talks on the compose network.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  api:
    ports: !reset []
    restart: unless-stopped
    environment:
      ERGPLAN_ENV: prod
  worker:
    restart: unless-stopped
    environment:
      ERGPLAN_ENV: prod
      ERGPLAN_WORKER_CONCURRENCY: ${ERGPLAN_WORKER_CONCURRENCY:-2}
      ERGPLAN_WEB_INTERNAL_URL: http://web:3000
  web:
    ports: !reset []
    restart: unless-stopped
  billx:
    ports: !reset []
    restart: unless-stopped
  docling:
    restart: unless-stopped
    mem_limit: 3g
  caddy:
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: !override ["80:80", "443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  caddydata:
  caddyconfig:
