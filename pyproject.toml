[project]
name = "billx"
version = "0.0.0"
description = "billx: verified-reading electricity and gas bill engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6",
  "pypdfium2>=4.30",
  "pillow>=11",
  "numpy>=2",
  "reportlab>=4.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "openai>=1.50",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.8", "httpx2>=2.13"]  # httpx2: the openai SDK's HTTP layer, mocked in tests
ocr = ["paddlepaddle>=3.3", "paddleocr>=3.7", "rapidocr>=3.10", "onnxruntime>=1.20"]  # local readers (D4)

[project.scripts]
billx = "billx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["billx"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --dist loadgroup"
markers = ["ocr: runs the local OCR engine on rendered pages (slow, CPU)"]
