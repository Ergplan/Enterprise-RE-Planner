name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ergplan, POSTGRES_PASSWORD: ergplan, POSTGRES_DB: ergplan_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ergplan" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ergplan:ergplan@localhost:5432/ergplan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: corepack enable
      - name: Install API
        working-directory: apps/api
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: Migrate
        working-directory: apps/api
        run: .venv/bin/alembic upgrade head
      - name: Install web
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: All watcher checks
        run: python3 tools/watch/watch.py --once
      - name: 15-minute site solves (Stage 6)
        working-directory: apps/api
        run: .venv/bin/pytest -m slow -q
      - if: always()
        run: cat tools/watch/status.json || true
