[project]
name = "ergplan"
version = "0.0.0"
description = "jouleWise | ergPLAN — RE sizing and landed cost engine for Indian industrial consumers"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]>=0.34",
  "pydantic==2.14.2",
  "pydantic-settings>=2.6",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "python-multipart>=0.0.20",
  "pypdfium2==5.14.0",
  "pdfplumber==0.11.10",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "pyomo==6.10.1",
  "highspy==1.15.1",
  "numpy>=2.1",
  "openpyxl>=3.1",
  "openai==3.42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.17.3", "mypy==2.4.1", "types-PyYAML"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ergplan*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "external: calls billx, OpenAI or Anthropic over the network; excluded from the watcher",
  "db: needs the Postgres test database",
  "slow: 15-minute site solves (minutes); run by CI's site step and the stage end-to-end, not the watcher",
]
addopts = "-m 'not external and not slow' -q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"alembic/**" = ["E501"]
