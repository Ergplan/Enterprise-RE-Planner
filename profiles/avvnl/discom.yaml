# synthetic layout avvnl-ht-synth-v1 (build prompt section 7); real versions are drafted from
# the team's confirmed bills (Stage 3).
id: avvnl
name: Ajmer Vidyut Vitran Nigam Limited
state: Rajasthan
bill_type: electricity
match:
