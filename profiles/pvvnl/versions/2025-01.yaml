# PVVNL, DRAFT: the synthetic HV-2 layout pvvnl-hv2-synth-v1 (build prompt section 7). Every
# param is a synthetic stand-in so the rules and T01-T05 run end to end; the real UPERC order
# is pending-for-user and replaces them in a new version.
version: "2025-01"
effective_from: "2025-01"
status: draft
layout_ids: [pvvnl-hv2-synth-v1]
# its rules, params and template are the synthetic layout's (stand-in rates): they apply only
# to a bill that prints the synthetic footer, never to a real bill of this discom
layout_match: "Synthetic test document generated by billx synth"
prompt_hints:
  - "The consumer's account number is printed as 'AC-No' or 'Account No.' (a 10-digit number)."
  - "The reading period is printed as 'Reading Period : <from> to <to>', or, on bills without that line, as the previous and current reading dates of the meter table (give the dates only, without the time)."
  - "When the bill prints no 'Bill Month', the bill month is the latest month in the 'Last six month's consumption' table (for example MAR-2025)."
  - "The kVAh billed is the 'Net Billed Unit' (or the sum printed in the meter table's KVAH rows); the kWh is the meter table's KWH row."
  - "'Payable by Due date' is the net payable: the 'Payable Amount' less the due-date rebate. totals.due_date_rebate is the 'Due Date Rebate (₹)' printed beside them (not a 'Rebate (₹)(-)' line of the charges, and not the 'Due date rebate adjustment' line, which adjusts an earlier bill). On an open-access adjustment bill the net payable is 'Amount Payable before Due Date (Rebate@1%)'."
  - "On an 'OPEN ACCESS ADJUSTMENT BILL' (or settlement bill), open_access.re_kwh is the 'Total' row of the 'Final Adjustable Units' column under 'ADJUSTABLE OPEN ACCESS UNITS (KVAH)': the open-access units set off against this bill's consumption. Give it as printed, in kVAh (never converted), even though the bill does not say the units are renewable."
  - "On an open-access adjustment or settlement bill, energy.kvah is the total consumption: the 'Total' row of the 'MONTHLY CONSUMPTION' column for the bill's 'Consumption Month' (not the 'OA Purchase Month' column), and energy.billed_units is the 'Total' row of 'BILLABLE CONSUMPTION AT DISTRIBUTION LICENSEE' (the units supplied by the grid). The 'KWH Purchased' column is the open-access purchase, not consumption."
  - "The maximum demand in kVA is the meter table's KVA row 'Meter Units' (the 'Recorded Demand' reading multiplied by the M.F.); the 'Recorded Demand' column alone is the raw reading, not the kVA demand."
# open-access adjustment and settlement bills print their open-access units in kVAh; the
# team stores them as printed (26 Oct 2026)
printed_units:
  - paths: [open_access.re_kwh, open_access.non_re_kwh, open_access.banked_kwh]
    unit: kVAh
    when: "open access adjustment|adjustable open access units|open access settlement"
tod_complete: true          # the layout prints every TOD slot, so G15 fails on a mismatch
# the bill month is the reading month (real bills: 'Last six month's consumption') or the
# month after it (the synthetic layout's 'Bill Month')
bill_month_offset: [0, 1]

params:
  demand_rate_kva: 300.00
  energy_rate_kvah: 7.10
  tod_surcharge_rate: 1.10
  tod_rebate_rate: -0.55
  ed_rate_kvah: 0.50
params_notes:
  demand_rate_kva: {unit: INR/kVA/month, source: "synthetic stand-in (billx synth pvvnl-hv2-synth-v1), pending the UPERC tariff order"}
  energy_rate_kvah: {unit: INR/kVAh, source: "synthetic stand-in, pending the UPERC tariff order"}
  tod_surcharge_rate: {unit: INR/kVAh, source: "synthetic stand-in, pending the UPERC tariff order"}
  tod_rebate_rate: {unit: INR/kVAh, source: "synthetic stand-in, pending the UPERC tariff order"}
  ed_rate_kvah: {unit: INR/kVAh, source: "synthetic stand-in, pending the Uttar Pradesh electricity duty notification"}

rules:
  - id: pvvnl.electricity_duty
    description: electricity duty = ED rate x total kVAh
    severity: error
    tolerance: 1
    actual: item("Electricity Duty")
    expected: param("ed_rate_kvah") * meter("Total", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the duty amount, or 2 kVAh in the total register"
  - id: pvvnl.tod_surcharge
    description: TOD surcharge = rate x TOD-3 kVAh
    severity: error
    tolerance: 1
    actual: item("TOD Surcharge")
    expected: param("tod_surcharge_rate") * meter("TOD-3", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the surcharge amount, or 1 kVAh in the TOD-3 row"
  - id: pvvnl.tod_rebate
    description: TOD rebate = rate x TOD-1 kVAh (negative)
    severity: error
    tolerance: 1
    actual: item("TOD Rebate")
    expected: param("tod_rebate_rate") * meter("TOD-1", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the rebate amount, or 2 kVAh in the TOD-1 row"
