    pages: [445, 446]
    focus: "Rate schedule HV-2 Large and Heavy Power, (A) Urban Schedule only: one row per supply-voltage band with demand and energy charges. Skip the rural schedule and seasonal industries."
  - jurisdiction: uppcl
    family: tod_slots
    document: 3a046bfa2e2f
    pages: [446]
    focus: "HV-2 ToD structure: one row per season (summer, winter) with every printed time band."
  - jurisdiction: uppcl
    family: oa_charge
