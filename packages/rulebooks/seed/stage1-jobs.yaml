# Stage 1 reading plan: which pages of which stored order feed which draft rulebook.
# Run: apps/api/.venv/bin/python tools/dev/seed_stage1.py   (writes drafts; approval is separate)
# Documents are named by SHA-256 prefix so the plan is valid on any machine.
jobs:
  - jurisdiction: npcl
    family: tariff_schedule
    document: ff36813e2671          # UPERC NPCL Tariff Order FY 2026-27
    pages: [387, 388]
    focus: "Rate schedule HV-2 Large and Heavy Power, (A) Urban Schedule only: one row per supply-voltage band with demand and energy charges. Skip the rural schedule (it is printed only as a rebate) and seasonal industries."
  - jurisdiction: npcl
    family: tod_slots
    document: ff36813e2671
    pages: [388]
    focus: "HV-2 ToD structure: one row per season (summer, winter) with every printed time band."
  - jurisdiction: npcl
    family: oa_charge
    document: ff36813e2671
    pages: [315, 316, 321, 323]
    focus: "Approved open-access charges only: the average wheeling charge approved by the Commission (Table 9-5) with the exemptions in paras 9.2.11 and 9.2.13; the cross-subsidy surcharge APPROVED for HV-2 (Table 9-14, column D 'Approved'), one row per HV-2 supply-voltage band with scope.voltage_kv, scope.category ['HV-2'] and body.value; the additional surcharge approved (para 9.4.7). Ignore every petitioner submission table."
  - jurisdiction: uppcl
    family: tariff_schedule
    document: 3a046bfa2e2f          # UPERC State DISCOMs (PVVNL, MVVNL, PuVVNL, DVVNL, KESCO) FY 2026-27
    pages: [445, 446]
    focus: "Rate schedule HV-2 Large and Heavy Power, (A) Urban Schedule only: one row per supply-voltage band with demand and energy charges. Skip the rural schedule and seasonal industries."
  - jurisdiction: uppcl
    family: tod_slots
    document: 3a046bfa2e2f
    pages: [446]
    focus: "HV-2 ToD structure: one row per season (summer, winter) with every printed time band."
  - jurisdiction: uppcl
    family: oa_charge
    document: 3a046bfa2e2f
    pages: [379, 384, 386]
    focus: "Approved open-access charges only: the average wheeling charge approved (Table 10-3) with the exemption in para 10.3.6; the distribution losses approved for OA consumers by voltage level (Table 10-11, para 10.4.11) as component wheeling_losses, basis percent_in_kind, one row per voltage band with scope.voltage_kv; the cross-subsidy surcharge APPROVED for HV-2 (Table 10-14, column D), one row per HV-2 supply-voltage band with scope.voltage_kv, scope.category ['HV-2'] and body.value. Ignore petitioner and 'computed' columns."
  - jurisdiction: UP
    family: oa_charge
    document: 3a046bfa2e2f
    pages: [377, 384]
    focus: "State-wide charges for open access in Uttar Pradesh: the intra-state transmission charge payable by open access customers for FY 2026-27 (para 10.2.1, component stu_transmission, basis inr_per_kwh, scope.connection ['intra_state','ists']); the inter-state transmission loss and the intra-state transmission loss applicable to all open access consumers (para 10.4.11), as components ists_losses and stu_losses with basis percent_in_kind."
  - jurisdiction: msedcl
    family: tariff_schedule
    document: 5b1111fa8a7d          # MERC Case 75/2025 post-remand order of 25 Mar 2026 (MSEDCL tariff revised)
    pages: [100]
    focus: "Only the table 'Summary of HT Tariff for FY 2026-27, effective from 1 April, 2026'. Rows for HT I (A) HT - Industry and HT II: HT - Commercial, each twice: the EHV block (66 kV and above: scope.voltage_kv {min: 66}) and the HT block (33 kV, 22 kV and 11 kV: scope.voltage_kv {max: 33}). billing_basis kvah; demand_charge Rs/kVA/mth; energy_charge.base = Energy Charge; retail_wheeling_charge = Wheeling Charge where printed (the HT block), omitted where '-'."
  - jurisdiction: msedcl
    family: tod_slots
    document: 5b1111fa8a7d
    pages: [77, 79]
    focus: "ToD slots approved for FY 2026-27, percentage of energy charge column (not the residential Rs./unit column). Two rows: April to September and October to March, scope.category ['HT I (A)', 'HT I (B)', 'HT II (A)']. Name the slots exactly 'normal' (00:00-09:00, no charge, from the banking ruling on p. 79), 'solar' (09:00-17:00, rebate) and 'peak' (17:00-24:00, +20%). The note under the table gives the FY 2026-27 (FY27) solar rebates: 15% April to September and 25% October to March."
  - jurisdiction: msedcl
    family: oa_charge
    document: 5b1111fa8a7d
    pages: [106]
    focus: "Cross Subsidy Surcharge for FY 2026-27, HT category, column 'Approved CSS Rs./kWh' only: HT I (A) (i) HT - Industry and HT II (A) HT - Commercial, each for EHV (66 kV and above: scope.voltage_kv {min: 66}) and HT (33, 22, 11 kV: scope.voltage_kv {max: 33}); component cross_subsidy_surcharge, basis inr_per_kwh, scope.connection ['intra_state','ists']."
  - jurisdiction: msedcl
    family: settlement
    document: 5b1111fa8a7d
    pages: [77, 78, 79]
    focus: "Banking of surplus energy as ruled in para 18.21 under Regulation 20.3 of the DOA Regulations: monthly banking, no carry forward, slot-wise drawal windows. One row, scope.connection ['intra_state','ists'], scope.source ['any_re']. granularity tod_slot_monthly; banking.allowed true; banking.period monthly; carry_over false; buckets per_slot; drawal_windows with deposited_in_slots and allowed_slots using slot names 'normal', 'solar', 'peak'; lapse.treatment as printed. Do not invent a banking charge."
  - jurisdiction: UP
    family: settlement
    document: 5ea285b34934          # UPERC (Captive and Renewable Energy Generating Plants) Regulations, 2024 — scanned, OCR text
    pages: [14, 15, 16, 17, 18, 19, 20]
    pages_per_call: 7
    focus: "Regulation 12 Banking of Energy for Renewable Energy based Captive plants (row 2 of the table in 12(iv), other than bagasse). Two rows: one for solar, wind and hybrid (scope.source ['solar','wind','hybrid'], banking charge 8% in kind per 12(xi)), one for other RE such as biomass and small hydro (scope.source ['any_re'] is not right for these; use scope.source ['any'] and say in notes it covers the 12% case). Both rows: scope.ownership ['captive','group_captive'], scope.connection ['intra_state']; granularity block_15min; banking.allowed true; banking.period monthly; banking.carry_over true; banking.cap {pct_of_injection '25', pct_of_consumption '30', combine 'higher', per_user true, period 'month'}; banking.in_block_banking_pct '100'; banking.ageing 'fifo'; banking.requires_day_ahead_schedule true; banking.buckets 'per_slot'; drawal_windows with slot names 'peak' and 'off_peak' per 12(viii); lapse treatment 'lapses' with rec_eligible true per the table; set_off_order per 12(xii)(a): captive_generation, banked_energy, bilateral (exchange or bilateral), discom."
