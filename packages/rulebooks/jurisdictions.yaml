  - {id: kesco, name: Kanpur Electricity Supply Company Limited, state: UP, parent: uppcl}
  - {id: msedcl, name: Maharashtra State Electricity Distribution Co. Ltd., state: MH}
  - {id: aeml, name: Adani Electricity Mumbai Limited (Distribution), state: MH}
