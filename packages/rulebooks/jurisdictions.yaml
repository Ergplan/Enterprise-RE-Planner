# States, regulators and distribution licensees. DISCOM ids are billx profile ids where billx has one.
# A DISCOM's parent is its state or a group sharing one tariff order (uppcl). Synced into the
# jurisdictions table by `python -m ergplan.rulebook.cli sync-jurisdictions` (idempotent).
regulators:
  - {id: CERC, name: Central Electricity Regulatory Commission}
  - {id: UPERC, name: Uttar Pradesh Electricity Regulatory Commission, state: UP}
  - {id: MERC, name: Maharashtra Electricity Regulatory Commission, state: MH}
  - {id: KERC, name: Karnataka Electricity Regulatory Commission, state: KA}
  - {id: GERC, name: Gujarat Electricity Regulatory Commission, state: GJ}
  - {id: RERC, name: Rajasthan Electricity Regulatory Commission, state: RJ}
  - {id: TNERC, name: Tamil Nadu Electricity Regulatory Commission, state: TN}
  - {id: TGERC, name: Telangana Electricity Regulatory Commission, state: TS}
  - {id: APERC, name: Andhra Pradesh Electricity Regulatory Commission, state: AP}
  - {id: PSERC, name: Punjab State Electricity Regulatory Commission, state: PB}
  - {id: HERC, name: Haryana Electricity Regulatory Commission, state: HR}
