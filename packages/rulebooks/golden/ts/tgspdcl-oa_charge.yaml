# TGERC Retail Supply Tariff Order FY 2026-27 (sha256 of the stored PDF in source_documents): Table 3-43
# "CSS determined for TGSPDCL for FY 2026-27", column "Allowable CSS", HT-I Industry, PDF pages 152-153
# (effective 01.04.2026 to 31.03.2027, para 3.21.24). Aggregate T&D charge "D" in Rs/kWh by voltage,
# para 3.21.22, PDF page 152. The Additional Surcharge (Rs. 0.13/kWh) is stated for H1 only: not seeded.
jurisdiction: tgspdcl
family: oa_charge
tests:
  - {name: "CSS HT-I(A) 11 kV 1.98", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.98"}}
  - {name: "CSS HT-I(A) 33 kV 1.73", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.73"}}
  - {name: "CSS HT-I(A) 132 kV 1.62", given: {context: {connection: ists, category: "HT-I(A)", voltage_kv: 132}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.62"}}
  - {name: "CSS HT-I(A) 220 kV is the 132 kV-and-above band", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 220}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.62"}}
  - {name: "CSS per kWh", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /basis}, expect: {value: inr_per_kwh}}
  - {name: "T&D charge 11 kV 0.29", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 11}, where: {/component: wheeling}, field: /value}, expect: {value: "0.29"}}
  - {name: "T&D charge 33 kV 0.09", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 33}, where: {/component: wheeling}, field: /value}, expect: {value: "0.09"}}
  - {name: "T&D charge 132 kV 0.12", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 132}, where: {/component: wheeling}, field: /value}, expect: {value: "0.12"}}
