# TGERC Retail Supply Tariff Order FY 2026-27: Table 3-44 "CSS determined for TGNPDCL for FY 2026-27",
# column "Allowable CSS", HT-I Industry, PDF pages 153-154 (effective 01.04.2026 to 31.03.2027, para
# 3.21.24). Aggregate T&D charge "D" in Rs/kWh by voltage, para 3.21.22, PDF page 152.
jurisdiction: tgnpdcl
family: oa_charge
tests:
  - {name: "CSS HT-I(A) 11 kV 1.99", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.99"}}
  - {name: "CSS HT-I(A) 33 kV 1.79", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.79"}}
  - {name: "CSS HT-I(A) 132 kV 1.69", given: {context: {connection: ists, category: "HT-I(A)", voltage_kv: 132}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "1.69"}}
  - {name: "CSS per kWh", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}, field: /basis}, expect: {value: inr_per_kwh}}
  - {name: "T&D charge 11 kV 0.47", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 11}, where: {/component: wheeling}, field: /value}, expect: {value: "0.47"}}
  - {name: "T&D charge 33 kV 0.14", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 33}, where: {/component: wheeling}, field: /value}, expect: {value: "0.14"}}
  - {name: "T&D charge 132 kV 0.12", given: {context: {connection: intra_state, category: "HT-I(A)", voltage_kv: 132}, where: {/component: wheeling}, field: /value}, expect: {value: "0.12"}}
