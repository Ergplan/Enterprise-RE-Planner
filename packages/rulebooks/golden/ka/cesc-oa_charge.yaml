# KERC Combined Tariff Order 2025 (ESCOMs), para 6.10.6, "For using CESC's network only", FY 27, HT
# injection / HT drawal: wheeling charge in paise per unit with the applicable loss % in brackets.
jurisdiction: cesc
family: oa_charge
tests:
  - {name: "HT wheeling 0.39", given: {context: {connection: intra_state, voltage_kv: 11}, where: {/component: wheeling}, field: /value}, expect: {value: "0.39"}}
  - {name: "HT wheeling at 33 kV 0.39", given: {context: {connection: ists, voltage_kv: 33}, where: {/component: wheeling}, field: /value}, expect: {value: "0.39"}}
  - {name: "HT loss 0.42 %", given: {context: {connection: intra_state, voltage_kv: 11}, where: {/component: wheeling_losses}, field: /value}, expect: {value: "0.42"}}
  - {name: "loss in kind", given: {context: {connection: intra_state, voltage_kv: 11}, where: {/component: wheeling_losses}, field: /basis}, expect: {value: percent_in_kind}}
