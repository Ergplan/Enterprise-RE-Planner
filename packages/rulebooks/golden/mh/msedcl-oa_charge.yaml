# 'Approved CSS Rs./kWh', PDF page 106.
jurisdiction: msedcl
family: oa_charge
tests:
  - {name: "CSS HT I(A) EHV 2.11", given: {context: {connection: intra_state, category: "HT I (A)", voltage_kv: 132}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "2.11"}}
  - {name: "CSS HT I(A) 11 kV 2.11", given: {context: {connection: intra_state, category: "HT I (A)", voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "2.11"}}
  - {name: "CSS HT II(A) 33 kV 2.11", given: {context: {connection: ists, category: "HT II (A)", voltage_kv: 33}, where: {/component: cross_subsidy_surcharge}, field: /value}, expect: {value: "2.11"}}
  - {name: "CSS per kWh", given: {context: {connection: intra_state, category: "HT I (A)", voltage_kv: 11}, where: {/component: cross_subsidy_surcharge}, field: /basis}, expect: {value: inr_per_kwh}}
