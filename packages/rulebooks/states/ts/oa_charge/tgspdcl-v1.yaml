- label: Transmission and wheeling (aggregate T&D charge) · 11 kV
  scope:
    connection:
    - intra_state
    - ists
    voltage_kv:
      max: 11
  body:
    basis: inr_per_kwh
    notes: The order's per-unit aggregate of transmission and voltage-wise distribution (wheeling) charges at this voltage
      ('D', para 3.21.22; columns TGSPDCL then TGNPDCL, Rs/kVA/month and Rs/kWh). The separate TGTRANSCO and distribution
      MYT orders that set the per-kVA charges are not in the corpus; open-access losses are not seeded (the order's 'L' includes
      commercial losses).
    value: '0.29'
    component: wheeling
  source_ref:
