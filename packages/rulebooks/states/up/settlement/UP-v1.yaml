family: settlement
jurisdiction: UP
version: 1
status: approved
title: UPERC (Captive and Renewable Energy Generating Plants) Regulations, 2024 (CRE Regulations 2024) · pages 14–20
effective_from: '2025-10-17'
effective_to: null
