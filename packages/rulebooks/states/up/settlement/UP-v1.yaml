      Captive or month or 30% of the total | No compensation shall be paid for
      Co- monthly consumption — of | the lapsed energy. However, such
      generating electricity from the | RE Captive or Co-generating plant
    document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    effective_from: '2025-10-17'
  field_refs:
    /granularity:
      kind: regulation
      page: 19
      quote: |-
        Banking charges shall be levied on energy banked in each 15-minute time
        block, determined at consumption end i.e. after accounting for losses
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /set_off_order:
      kind: regulation
      page: 20
      quote: |-
        i) Captive Generation after deduction of losses.
        ii) Banked Energy
        iii) Other Open Access Power through Exchange / Bi-lateral transactions, if
        applicable
        iv) Discom power
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/ageing:
      kind: regulation
      page: 17
      quote: |-
        v) The withdrawn and the lapsed banked energy shall be adjusted on ‘First in First
        Out’ (FIFO) basis.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/period:
      kind: regulation
      page: 16
      quote: |-
        Carry forward on monthly basis
        subject to the ceiling mentioned in
        column 3.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/carry_over:
      kind: regulation
      page: 16
      quote: |-
        Carry forward on monthly basis
        subject to the ceiling mentioned in
        column 3.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/cap/per_user:
      kind: regulation
      page: 16
      quote: |-
        Provided that the ceiling of | provisions of CERC (REC)
        25% of the energy injected | Regulations, 2022 and amendments
        during the month or 30% of | thereof;
        the total monthly | Provided that, for Biomass based
        consumption, whichever is | Captive or Co-generating plant the
        higher will be computed | banked energy remaining unutilized
        individually for each captive | beyond the monthly ceiling would
        us
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/charge/value:
      kind: regulation
      page: 19
      quote: |-
        Banking charges, in energy terms
        shall be 8% for Wind, Solar and Hybrid RE comprising Wind and Solar energy
        and 12% for all other Captive and co-Generating Plants;
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/drawal_windows:
      kind: regulation
      page: 17
      quote: |-
        viii) Energy banked in the off-peak hours shall be allowed to be withdrawn only in
        off-peak hours. Energy banked in peak hours shall be allowed to be withdrawn
        both in peak and off-peak hours.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/lapse/treatment:
      kind: regulation
      page: 16
      quote: |-
        No compensation shall be paid for
        the lapsed energy. However, such
        RE Captive or Co-generating plant
        shall be entitled to get Renewable
        Energy Certificates for such lapsed
        banked energy
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/lapse/rec_eligible:
      kind: regulation
      page: 16
      quote: |-
        shall be entitled to get Renewable
        Energy Certificates for such lapsed
        banked energy
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/cap/pct_of_injection:
      kind: regulation
      page: 16
      quote: |-
        Banking of energy subject to a | Carry forward on monthly basis
        Energy maximum ceiling of 25% of | subject to the ceiling mentioned in
        based the energy injected during the | column 3.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/in_block_banking_pct:
      kind: regulation
      page: 17
      quote: |-
        Provided that 100% banking of energy injected in MW terms shall be allowed
        on 15-minute time block basis;
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/cap/pct_of_consumption:
      kind: regulation
      page: 16
      quote: |-
        month or 30% of the total | No compensation shall be paid for
        Co- monthly consumption — of | the lapsed energy.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
    /banking/requires_day_ahead_schedule:
      kind: regulation
      page: 17
      quote: |-
        vi) The Banking as well as withdrawal of banked energy shall be subject to Day-
        ahead scheduling. Scheduling of energy, including Banked as well as
        withdrawal of banked energy, shall be mandatory for availing the banking
        facility.
      document_id: 2ce52fb6-595c-539a-ad88-e134fc3fa3af
- label: RE captive (other than bagasse) · biomass, small hydro and other RE · monthly banking, 12% charge
  scope:
    source:
    - biomass
    - small_hydro
    - waste_to_energy
    ownership:
    - captive
    - group_captive
    connection:
