rows:
- label: Renewable captive/co-gen (non-bagasse) · solar, wind & hybrid
  scope:
    source:
    - solar
    - wind
    - hybrid
    ownership:
    - captive
    - group_captive
    connection:
    - intra_state
  body:
    notes: Row 2 of Regulation 12(iv), for Renewable Energy based Captive or Co-generating Plants (other than bagasse), applied
      specifically to solar, wind and hybrid using the 8% banking charge in Regulation 12(xi).
    banking:
      cap:
        period: month
        combine: higher
        per_user: true
        pct_of_injection: '25'
        pct_of_consumption: '30'
      lapse:
        treatment: lapses
        rec_eligible: true
      ageing: fifo
      charge:
        kind: in_kind_percent
        value: '8'
      period: monthly
      allowed: true
      buckets: per_slot
      carry_over: true
      drawal_windows:
      - allowed_slots:
        - off_peak
        deposited_in_slots:
        - off_peak
      - allowed_slots:
        - peak
        - off_peak
        deposited_in_slots:
        - peak
      withdrawal_priority: allowed_slots_in_order
      in_block_banking_pct: '100'
      requires_day_ahead_schedule: true
    granularity: block_15min
    set_off_order:
    - captive_generation
    - banked_energy
    - bilateral
    - discom
  source_ref:
    kind: regulation
    note: page text read by OCR
    page: 16
    quote: |-
      2 Renewable Banking of energy subject to a | Carry forward on monthly basis
      Energy maximum ceiling of 25% of | subject to the ceiling mentioned in
