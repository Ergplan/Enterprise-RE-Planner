  body:
    notes: Same as row 2 of Regulation 12(iv) but covering the 12% banking charge case in Regulation 12(xi) for “all other
      Captive and co-Generating Plants”, including biomass and small hydro. Note that within this table row, biomass beyond
      the monthly ceiling is treated as sale to the licensee at Rs. 1/unit or PPA rate and is not REC-eligible, even though
      the main row text for lapsed energy provides REC eligibility and no compensation.
    banking:
      cap:
        period: month
        combine: higher
        per_user: true
        pct_of_injection: '25'
        pct_of_consumption: '30'
      lapse:
        treatment: lapses
        rec_eligible: true
      ageing: fifo
      charge:
        kind: in_kind_percent
        value: '12'
      period: monthly
      allowed: true
      buckets: per_slot
      carry_over: true
      drawal_windows:
      - allowed_slots:
        - off_peak
        deposited_in_slots:
        - off_peak
      - allowed_slots:
        - peak
        - off_peak
        deposited_in_slots:
        - peak
      withdrawal_priority: allowed_slots_in_order
      in_block_banking_pct: '100'
      requires_day_ahead_schedule: true
    granularity: block_15min
    set_off_order:
    - captive_generation
    - banked_energy
    - bilateral
    - discom
  source_ref:
    kind: regulation
