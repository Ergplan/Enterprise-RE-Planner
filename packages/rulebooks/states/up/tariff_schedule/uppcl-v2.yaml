rows:
- label: HV-2 urban · supply up to 11 kV
  scope:
    category:
    - HV-2
    rate_block: Urban Schedule
    voltage_kv:
      max: 11
  body:
    category: HV-2
    billing_basis: kvah
    demand_charge:
      basis: inr_per_kva_month
      value: '300.00'
      billing_demand_rule:
        min_pct_of_contract_demand: '75'
        excess_demand_penalty_multiplier: '2'
    energy_charge:
      base: '7.10'
  source_ref:
    kind: order
    page: 445
    quote: "(A) Urban Schedule: ... For supply up to 11 \nkV ... BASE RATE\nDemand Charges Rs. 300.00 / kVA / \nmonth ...\
      \ Energy Charges Rs. 7.10 / kVAh"
    document_id: e071ac95-048e-58dc-a9da-b2e59365f106
    effective_from: '2026-07-02'
  field_refs:
    /demand_charge/billing_demand_rule/min_pct_of_contract_demand:
      kind: order
      note: General provisions, billable demand
      page: 410
      quote: the billable load / demand during a month shall be the actual maximum load / demand as recorded by the meter
        (can be in parts of kW or kVA) or 75% of the contracted load / demand (kW or kVA), whichever is higher
      document_id: e071ac95-048e-58dc-a9da-b2e59365f106
    /demand_charge/billing_demand_rule/excess_demand_penalty_multiplier:
      kind: order
      note: General provisions 7(ii)(b), other categories
      page: 411
      quote: such excess load / demand shall be levied equal to 200% of the normal rate apart from the normal fixed / demand
        charges
      document_id: e071ac95-048e-58dc-a9da-b2e59365f106
