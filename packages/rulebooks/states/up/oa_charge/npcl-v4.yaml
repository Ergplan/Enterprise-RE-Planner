rows:
- label: Average wheeling charge · all open access consumers
  scope:
    connection:
    - intra_state
    - ists
  body:
    basis: inr_per_kwh
    value: '1.03'
    component: wheeling
    exemptions:
    - note: Embedded Open Access customers who are already liable for payment of Demand Charges will not be required to pay
        any wheeling charges to the Distribution Licensee.
      sunset: null
      condition: other
      waived_pct: '100'
    - note: Open Access consumers directly connected to the transmission network are exempt from wheeling charges as wheeling
        charges are applicable only when the distribution system is used.
      sunset: null
      condition: other
      waived_pct: '100'
  source_ref:
    kind: order
    page: 315
    quote: TABLE 9-5 WHEELING CHARGES AS APPROVED BY THE COMMISSION FOR FY 2026-27 ... Average Wheeling Charges Rs./kWh 1.03
      ... open access consumers who are already paying demand charge need not to pay any wheeling charges ... If an Open Access
      consumer is directly connected to the transmission network, levying wheeling charges is unjustified.
    document_id: aea2bbdf-dfff-5466-858d-2e448e7e60e3
    effective_from: '2026-07-02'
