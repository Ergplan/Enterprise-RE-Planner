# Madhyanchal Vidyut Vitran Nigam Limited (Uttar Pradesh). Drafted in Stage 3.2 from public knowledge of the name; no version
# yet: bills are read by the generic ladder (profile.status none) until the team's
# confirmed sample bills exist and a version is drafted from them (build prompt section 7).
id: mvvnl
name: Madhyanchal Vidyut Vitran Nigam Limited
state: Uttar Pradesh
bill_type: electricity
extends: pvvnl  # a sister discom on the same billing system
match:
  - "\\bMVVNL\\b"
  - "Madhyanchal Vidyut Vitran Nigam"
  - "मध्यांचल विद्युत वितरण निगम"
  - "\\bMadhyanchal\\b"
  - "मध्यांचल"
  - "(?<![A-Za-z])M\\.?V\\.?V\\.?N\\.?L(?![A-Za-z])"
