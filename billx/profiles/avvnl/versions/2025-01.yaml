# AVVNL, DRAFT: the synthetic HT layout avvnl-ht-synth-v1 (build prompt section 7). Every
# param is a synthetic stand-in so the rules and T01-T05 run end to end; the real RERC order
# is pending-for-user and replaces them in a new version.
version: "2025-01"
effective_from: "2025-01"
status: draft
layout_ids: [avvnl-ht-synth-v1]
# its rules, params and template are the synthetic layout's (stand-in rates): they apply only
# to a bill that prints the synthetic footer, never to a real bill of this discom
layout_match: "Synthetic test document generated by billx synth"
prompt_hints:
  - "The consumer's account number is the KNO (12 digits), not the 'A/c No' (an office code with slashes)."
  - "The reading period runs from 'Reading Date (Past)' to 'Reading Date (Present)'."
  - "The bill month is the 'Billing Month'; 'Bill Issue Date' is the bill date."
tod_complete: true          # the layout prints every TOD slot, so G15 fails on a mismatch
bill_month_offset: [0, 0]   # the bill month is the reading month

params:
  energy_rate_kvah: 7.30
  fixed_rate_kva: 330.00
  tod_surcharge_rate: 0.73
  tod_rebate_rate: -0.73
  ed_rate_kvah: 0.40
  water_cess_rate: 0.10
  urban_cess_rate: 0.15
  meter_rent: 1500.00
params_notes:
  energy_rate_kvah: {unit: INR/kVAh, source: "synthetic stand-in (billx synth avvnl-ht-synth-v1), pending the RERC tariff order"}
  fixed_rate_kva: {unit: INR/kVA/month, source: "synthetic stand-in, pending the RERC tariff order"}
  tod_surcharge_rate: {unit: INR/kVAh, source: "synthetic stand-in, pending the RERC tariff order"}
  tod_rebate_rate: {unit: INR/kVAh, source: "synthetic stand-in, pending the RERC tariff order"}
  ed_rate_kvah: {unit: INR/kVAh, source: "synthetic stand-in, pending the Rajasthan electricity duty notification"}
  water_cess_rate: {unit: INR/kVAh, source: "synthetic stand-in, pending the Rajasthan water conservation cess notification"}
  urban_cess_rate: {unit: INR/kVAh, source: "synthetic stand-in, pending the Rajasthan urban cess notification"}
  meter_rent: {unit: INR/month, source: "synthetic stand-in, pending the RERC tariff order"}

rules:
  - id: avvnl.electricity_duty
    description: electricity duty = ED rate x total kVAh
    severity: error
    tolerance: 1
    actual: item("Electricity Duty")
    expected: param("ed_rate_kvah") * meter("Total", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the duty amount, or max(1, 1/ED rate) kVAh in the total register"
  - id: avvnl.water_cess
    description: water conservation cess = rate x total kVAh
    severity: error
    tolerance: 1
    actual: item("Water Conservation Cess")
    expected: param("water_cess_rate") * meter("Total", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the cess amount, or 10 kVAh in the total register"
  - id: avvnl.urban_cess
    description: urban cess = rate x total kVAh
    severity: error
    tolerance: 1
    actual: item("Urban Cess")
    expected: param("urban_cess_rate") * meter("Total", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the cess amount, or 7 kVAh in the total register"
  - id: avvnl.tod_surcharge
    description: TOD surcharge = rate x peak-hour kVAh (morning and evening peak slots)
    severity: error
    tolerance: 1
    actual: item("TOD Surcharge")
    expected: param("tod_surcharge_rate") * meters_sum("(Morning|Evening) Peak", quantity="kVAh", attr="gross_units")
    detects: "Rs 1 in the surcharge amount, or 2 kVAh across the peak slot rows"
  - id: avvnl.meter_rent
    description: meter rent = the fixed monthly rent
    severity: error
    tolerance: 1
    actual: item("Meter Rent")
    expected: param("meter_rent")
    detects: "Rs 1 in the meter rent amount"
